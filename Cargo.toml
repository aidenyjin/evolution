[package]
name = "primordia"
version = "0.1.0"
edition = "2021"
description = "An open-ended cellular evolution simulator"
license = "MIT"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
bincode = "1.3"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false

[profile.dev]
opt-level = 1
